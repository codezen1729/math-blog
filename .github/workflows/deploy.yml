name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out the publishing package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Unpack the public website source
        working-directory: .
        run: unzip -q site-source.zip -d website

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public content and simulations
        run: |
          node scripts/check-content.mjs --public
          node --experimental-strip-types --test scripts/dynamics.test.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the static site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: pnpm build:pages

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
